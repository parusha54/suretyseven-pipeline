version: '3.8'

# The documented development setup runs the API and frontend locally.
# Compose provides PostgreSQL only; the app containers are not configured here.
services:
  db:
    image: postgres:15-alpine
    container_name: suretyseven-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: suretyseven
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
